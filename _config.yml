#metdata
baseurl: "/ppwk-2025"
title: EBFS / Pilvipalvelut web-kehityksessä
description: Tervetuloa sivustolle!
remote_theme: "mmistakes/minimal-mistakes@4.24.0" #github pages backwards compatible versio
minimal_mistakes_skin: "dark"
locale: fi

#plugins
plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  
header:
  nav: main #navigaatio @ _data/navigation.yml

collections: #että _pages toimii:
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: pages 
    values:
      layout: single #default layout for _pages
      previous_label: "Edellinen viikko" #legacy from testing
      next_label: "Seuraava viikko" #legacy from testing

#footer
footer: "© 2025 ebfs @ github – Rakennettu Jekyllillä"
