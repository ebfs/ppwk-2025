name: Update deployment statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/daily-deployments.json'  # prevents infinite loop from JSON update
  workflow_dispatch:  # optional manual run

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      # Checkout full history
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Generate JSON of commits per day
      - name: Generate JSON of commits per day
        run: |
          mkdir -p assets
          echo "[" > assets/daily-deployments.json
          git log --date=short --pretty="%ad" \
            | sort \
            | uniq -c \
            | awk '{printf "  { \"date\": \"%s\", \"count\": %s },\n", $2, $1}' \
            >> assets/daily-deployments.json
          sed -i '$ s/,$//' assets/daily-deployments.json
          echo "]" >> assets/daily-deployments.json

      # Commit changes if the JSON updated
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add assets/daily-deployments.json
            git commit -m "[AUTO] update daily deployment stats"
            git push
          fi