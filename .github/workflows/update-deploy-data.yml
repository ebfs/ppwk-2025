name: Update deployment statistics

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/daily-deployments.json'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate JSON of commits per day
        run: |
          mkdir -p data
          echo "[" > data/daily-deployments.json
          git log --date=short --pretty="%ad" \
            | sort \
            | uniq -c \
            | awk '{printf "  { \"date\": \"%s\", \"count\": %s },\n", $2, $1}' \
            >> data/daily-deployments.json
          sed -i '$ s/,$//' data/daily-deployments.json
          echo "]" >> data/daily-deployments.json

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add data/daily-deployments.json
            git commit -m "Update deployment stats"
            git push
          fi